<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.D.A.M. — Autonomous Digital Analytical Mind</title>
    <link rel="icon" type="image/png" href="../../icon.png" />
    <!--
      Content-Security-Policy: the renderer never talks to a server — Gemini
      audio/vision flows through main-process IPC. Fonts are bundled locally
      (@fontsource), so nothing external is required offline. https/wss/blob are
      allowed only for the optional live-stream widget feature.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <style>
      body {
        margin: 0;
        background-color: #020205;
        overflow: hidden;
        color: #ffffff;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
